
<style>
#erd { padding: 1rem 0; }
#erd svg { width: 100%; }
</style>
<div id="erd"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"Anthropic Sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '13px',
    fontFamily: '"Anthropic Sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
    primaryColor: dark ? '#2a2a35' : '#f0f0f8',
    primaryBorderColor: dark ? '#5353a0' : '#9090d0',
    attributeBackgroundColorEven: dark ? '#1e1e28' : '#f8f8fc',
    attributeBackgroundColorOdd: dark ? '#232330' : '#ffffff',
  },
});
const diagram = `erDiagram
  users {
    uint id PK
    varchar name
    varchar email
    varchar password
    varchar role
    datetime created_at
  }
  sdlc_methodologies {
    uint id PK
    varchar name
    text description
    bool is_active
    uint created_by_id FK
    datetime created_at
  }
  sdlc_steps {
    uint id PK
    uint sdlc_id FK
    varchar name
    text description
    int order
    bool is_required
    int estimated_duration_days
    varchar allowed_doc_types
  }
  projects {
    uint id PK
    varchar name
    text description
    varchar status
    uint owner_id FK
    uint sdlc_id FK
    uint current_phase_id FK
    datetime created_at
  }
  project_members {
    uint id PK
    uint project_id FK
    uint user_id FK
    varchar role
    datetime joined_at
  }
  project_phases {
    uint id PK
    uint project_id FK
    uint sdlc_step_id FK
    varchar name
    int order
    varchar status
    bool is_required
    datetime unlocked_at
    datetime completed_at
  }
  tasks {
    uint id PK
    uint phase_id FK
    uint project_id FK
    varchar title
    text description
    uint assignee_id FK
    varchar priority
    varchar status
    datetime due_date
  }
  phase_documents {
    uint id PK
    uint phase_id FK
    uint project_id FK
    varchar title
    varchar doc_type
    varchar file_url
    uint uploaded_by FK
    datetime uploaded_at
  }
  users ||--o{ projects : "owns"
  users ||--o{ project_members : "joins"
  users ||--o{ tasks : "assigned to"
  users ||--|| sdlc_methodologies : "creates"
  sdlc_methodologies ||--o{ sdlc_steps : "defines"
  sdlc_methodologies ||--o{ projects : "used by"
  projects ||--o{ project_members : "has"
  projects ||--o{ project_phases : "has"
  projects ||--o{ tasks : "contains"
  projects ||--o{ phase_documents : "contains"
  project_phases ||--o{ tasks : "has"
  project_phases ||--o{ phase_documents : "has"
  sdlc_steps ||--o{ project_phases : "cloned into"
`;
const { svg } = await mermaid.render('erd-svg', diagram);
document.getElementById('erd').innerHTML = svg;

document.querySelectorAll('#erd svg .node').forEach(node => {
  const firstPath = node.querySelector('path[d]');
  if (!firstPath) return;
  const d = firstPath.getAttribute('d');
  const nums = d.match(/-?[\d.]+/g)?.map(Number);
  if (!nums || nums.length < 8) return;
  const xs = [nums[0], nums[2], nums[4], nums[6]];
  const ys = [nums[1], nums[3], nums[5], nums[7]];
  const x = Math.min(...xs), y = Math.min(...ys);
  const w = Math.max(...xs) - x, h = Math.max(...ys) - y;
  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rect.setAttribute('x', x); rect.setAttribute('y', y);
  rect.setAttribute('width', w); rect.setAttribute('height', h);
  rect.setAttribute('rx', '8');
  for (const a of ['fill', 'stroke', 'stroke-width', 'class', 'style']) {
    if (firstPath.hasAttribute(a)) rect.setAttribute(a, firstPath.getAttribute(a));
  }
  firstPath.replaceWith(rect);
});

document.querySelectorAll('#erd svg .row-rect-odd path, #erd svg .row-rect-even path').forEach(p => {
  p.setAttribute('stroke', 'none');
});
</script>
