name: Deploy MySDLC

on:
  repository_dispatch:
    types: [frontend-updated, backend-updated]
  workflow_dispatch:
    inputs:
      service:
        description: 'Which service to deploy'
        required: true
        default: 'all'
        type: choice
        options: [all, frontend, backend]

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - name: SSH into VPS and deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            SERVICE="${{ github.event.client_payload.service || inputs.service || 'all' }}"

            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "Deploying: $SERVICE"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

            cd /home/ericdaniel/MySDLC

            wait_for_port() {
              local PORT=$1
              local TIMEOUT=${2:-60}
              local ELAPSED=0
              echo "Waiting for port $PORT (timeout: ${TIMEOUT}s)..."
              while ! bash -c "echo >/dev/tcp/localhost/$PORT" 2>/dev/null; do
                if [ "$ELAPSED" -ge "$TIMEOUT" ]; then
                  echo "❌ Port $PORT did not open within ${TIMEOUT}s"
                  return 1
                fi
                sleep 2
                ELAPSED=$((ELAPSED + 2))
              done
              echo "✅ Port $PORT is open (${ELAPSED}s)"
              return 0
            }

            # Pull root repo in case docker-compose.yml changed
            git fetch origin main && git pull origin main

            # Pull the pre-built image from ghcr.io (no build on VPS)
            if [ "$SERVICE" = "frontend" ]; then
              docker compose pull frontend
              docker compose up -d --no-deps --force-recreate frontend

            elif [ "$SERVICE" = "backend" ]; then
              docker compose pull backend
              docker compose up -d --no-deps --force-recreate backend

            else
              docker compose pull
              docker compose up -d --force-recreate
            fi

            docker image prune -f

            # Health checks
            FAILED=0
            if [ "$SERVICE" = "frontend" ] || [ "$SERVICE" = "all" ]; then
              wait_for_port 3000 60 || FAILED=1
            fi
            if [ "$SERVICE" = "backend" ] || [ "$SERVICE" = "all" ]; then
              wait_for_port 8080 60 || FAILED=1
            fi

            if [ "$FAILED" = "1" ]; then
              echo "❌ Health check failed"
              docker compose logs --tail=30
              exit 1
            fi

            echo "✅ Deployment complete: $SERVICE"