services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_ROOT_PASSWORD: ${DB_PASS} 
      MYSQL_PASSWORD: ${DB_PASS}
      MYSQL_USER: ${DB_USER}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 90s
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build:
      context: ./mysdlc_backend
      dockerfile: Dockerfile
      cache_from:
        - type=local,src=/tmp/.buildx-cache-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      JWT_SECRET: ${JWT_SECRET}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY}
      
    ports:
      - "8080:8080" # Adjust to your backend port

  frontend:
    build:
      context: ./mysdlc_frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_CAPTCHA_SITE_KEY=0x4AAAAAADeDOS3zEVLcAeav
      cache_from:
        - type=local,src=/tmp/.buildx-cache-frontend
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - NEXT_PUBLIC_CAPTCHA_SITE_KEY=0x4AAAAAADeDOS3zEVLcAeav
    ports:
      - "3000:3000" # Adjust to your frontend port

volumes:
  mysql_data: